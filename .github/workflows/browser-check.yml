name: Browser check

# Живая браузерная проверка страниц: сравнение классических <script> и
# ESM-бандла (docs/MODULES-MIGRATION.md). Нужна при любой правке порядка
# загрузки скриптов, состава src/ или страниц.
#
# Триггеры — как в ci.yml (любой push и любой PR) плюс ручной запуск.
# Раньше здесь было `branches: [main, master]`, но веток main/master в
# репозитории нет (default-ветка — arena/…): после мержа проверка не
# выполнялась никогда, работала только на PR.
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install chromium for playwright
        run: npx playwright install --with-deps chromium

      - name: Build ESM bundle
        run: npm run build

      - name: Syntax check (cheap lint)
        run: npm run lint:syntax

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings=0

      - name: Dead globals check
        run: npm run check:globals

      - name: Unit tests
        run: npm test

      - name: Browser check (classic vs bundle)
        run: npm run check:browser -- --require

      # Отдельные шаги вместо `npm run check:scorecards` (цепочка из пяти
      # скриптов через &&): в таком виде по прогону видно, какой именно скрипт
      # упал, а не только «что-то в браузерных проверках».
      - name: Scorecard mobile (layout)
        run: node tools/check-scorecard-mobile.js

      - name: Score entry mobile (touch targets)
        run: node tools/check-score-entry-mobile.js

      - name: Scoring header mobile (QR)
        run: node tools/check-scoring-header-mobile.js

      - name: Printcards preview
        run: node tools/check-printcards-preview.js

      - name: Entry scorecards
        run: node tools/check-entry-scorecards.js

      # ВРЕМЕННО: диагностика `npm run check:scorecards` — под npm цепочка
      # падает, а те же скрипты по отдельности проходят. Вывод уходит
      # комментарием в PR (логи джобы из песочницы недоступны).
      - name: Chain probe (temporary)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm run check:scorecards > /tmp/chain.log 2>&1
          code=$?
          {
            echo "chain exit=$code"
            echo "---- tail ----"
            tail -c 2500 /tmp/chain.log
          } > /tmp/chain.tail
          pr=$(gh pr view --json number --jq .number 2>/dev/null || true)
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file /tmp/chain.tail; fi
          exit 0

      - name: Scorecard realtime and offline PWA regression
        run: npm run check:scorecard-pwa

      - name: Mobile navigation header
        run: npm run check:nav
