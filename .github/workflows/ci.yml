name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # Локфайлы закоммичены (package-lock.json, functions/package-lock.json),
          # поэтому кэш npm детерминирован. Раньше здесь стояло
          # package-manager-cache: false, а шаг установки был `npm ci || npm install`:
          # без локфайла npm ci всегда падал, и CI собирался на произвольных
          # версиях dev-зависимостей (Playwright/Chromium, Vite, esbuild).
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (cheap lint)
        run: npm run lint:syntax

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings=0

      - name: Dead globals check
        run: npm run check:globals

      - name: RTDB listeners check
        run: npm run check:listeners

      - name: Font Awesome subset freshness
        run: npm run check:fonts

      - name: Run tests
        run: npm test

      - name: Check assets revisions (?v= in HTML, precache in sw.js)
        run: node tools/rev-assets.js --check

      - name: Check service worker precache
        run: node tools/test-sw-precache.js

      # Страницы грузят dist/livescoring-modules.js, а бандл коммитится
      # (Firebase Hosting деплоит репозиторий без шага сборки) — поэтому
      # устаревший бандл обязан ронять сборку. Проверка до любых сборок:
      # tools/check-bundle.js сам собирает бандл во временный каталог.
      - name: Check bundle freshness
        run: npm run check:bundle

      # Каталог деплоя public/ (минифицированное зеркало сайта) не коммитится,
      # но собирается на каждом деплое через hosting.predeploy — поэтому
      # сборка и её инварианты проверяются здесь.
      - name: Build and verify deploy artifact (public/)
        run: node tools/test-build-public.js
