name: Deploy

# Прод всегда собирается с ветки arena/01a02acd-livescoring (default branch),
# даже если workflow запустили с другой arena-ветки.
#
# Запуск:
#   • автоматически — push в arena/01a02acd-livescoring (цель hosting);
#   • вручную — Actions → Deploy → Run workflow (ветка в UI не важна:
#     checkout всё равно этой ветки). Ручной запуск нужен для functions.
#
# workflow_dispatch из Arena часто даёт 403: GH_TOKEN интеграции без
# actions:write. Автодеплой на push это обходит.
#
# Правила БД здесь НЕ деплоятся. Для них:
#   firebase deploy --only database --project livescore-b77e4

on:
  push:
    branches:
      - arena/01a02acd-livescoring
  workflow_dispatch:
    inputs:
      target:
        description: 'Что деплоить'
        required: true
        default: 'hosting'
        type: choice
        options:
          - hosting
          - functions
          - hosting,functions

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          ref: arena/01a02acd-livescoring

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy
        run: |
          npm run lint:syntax
          npm run lint -- --max-warnings=0
          npm run check:globals
          npm run check:listeners
          npm run check:fonts
          node tools/rev-assets.js --check
          npm test
          npm run check:bundle

      - name: Build deploy artifact (public/)
        run: npm run build:public

      - name: Check Firebase credentials are configured
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Секрет FIREBASE_SERVICE_ACCOUNT не задан."
            echo "Добавьте JSON сервисного аккаунта проекта livescore-b77e4"
            echo "в Settings → Secrets and variables → Actions как FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Install firebase-tools
        run: npm install --no-save firebase-tools@13

      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET: ${{ github.event.inputs.target || 'hosting' }}
        run: |
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          trap 'rm -f "$credentials_file"' EXIT
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          npx firebase deploy --only "$TARGET" --project livescore-b77e4 --non-interactive
