name: GitHub Pages

# github.io живёт в подкаталоге /livescoring/, а public/ собирается как
# корень Firebase (минификация + выкинутые js/*-двойники ESM). После #169
# Pages отдавал public/ — манифест /index.html уезжал на xdramerx-debug.github.io/,
# часть скриптов 404. Снова выкладываем исходники сайта (как старый
# «Deploy from a branch»), с дефолтной ветки.

on:
  push:
    branches:
      - arena/01a02acd-livescoring
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          ref: arena/01a02acd-livescoring
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage GitHub Pages tree
        run: |
          mkdir -p _pages
          cp -a *.html sw.js manifest.json _pages/
          cp -a css js dist img fonts _pages/
          touch _pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
