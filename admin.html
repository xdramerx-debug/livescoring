<div class="page-head"><div class="container"><h1 class="page-title"><i class="fas fa-shield-halved"></i> Админ-панель</h1></div></div>

<main class="container" style="padding:24px 20px 60px;">
    <div id="admin-login" class="card" style="max-width:400px;margin:0 auto;">
        <h2><i class="fas fa-lock"></i> Вход</h2>
        <div class="form-group"><label>Логин</label><input type="text" id="adm-user" class="form-input" placeholder="admin"></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="adm-pass" class="form-input"></div>
        <div id="adm-error" class="form-err hidden"></div>
        <button class="btn btn-g btn-block" onclick="adminLogin()">Войти</button>
    </div>

    <div id="admin-content" class="hidden">
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchTab('rounds',this)">Раунды</button>
            <button class="admin-tab" onclick="switchTab('alerts',this)">Вызовы 🚨</button>
            <button class="admin-tab" onclick="switchTab('tournaments',this)">Турниры</button>
            <button class="admin-tab" onclick="switchTab('players',this)">Игроки</button>
            <button class="admin-tab" onclick="switchTab('data',this)">Данные</button>
        </div>

        <div id="tab-rounds" class="admin-section">
            <div class="card"><h2><i class="fas fa-flag"></i> Все раунды</h2><div id="adm-rounds"></div></div>
        </div>

        <div id="tab-alerts" class="admin-section hidden">
            <div class="card"><h2><i class="fas fa-bell"></i> Вызовы на поле</h2><div id="admin-alerts-list"></div></div>
        </div>

        <div id="tab-tournaments" class="admin-section hidden">
            <div class="card">
                <h2><i class="fas fa-trophy"></i> Создать турнир</h2>
                <div class="form-row">
                    <div class="form-group"><label>Название</label><input type="text" id="tn-name" class="form-input" placeholder="Чемпионат"></div>
                    <div class="form-group"><label>Дата</label><input type="date" id="tn-date" class="form-input"></div>
                </div>
                <div class="form-group">
                    <label>Форматы</label>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;">
                        <label class="list-item" style="cursor:pointer;padding:8px 14px;"><input type="checkbox" id="tn-f-stroke" checked> Stroke Play</label>
                        <label class="list-item" style="cursor:pointer;padding:8px 14px;"><input type="checkbox" id="tn-f-stbl"> Stableford</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>ТИ</label>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;">
                        <label class="list-item" style="cursor:pointer;padding:8px 14px;"><input type="checkbox" id="tn-t-bk"> ⬛ Чёрный</label>
                        <label class="list-item" style="cursor:pointer;padding:8px 14px;"><input type="checkbox" id="tn-t-bl"> 🟦 Синий</label>
                        <label class="list-item" style="cursor:pointer;padding:8px 14px;"><input type="checkbox" id="tn-t-wh" checked> ⬜ Белый</label>
                        <label class="list-item" style="cursor:pointer;padding:8px 14px;"><input type="checkbox" id="tn-t-rd"> 🟥 Красный</label>
                    </div>
                </div>
                <button class="btn btn-g" onclick="createTournament()"><i class="fas fa-save"></i> Создать</button>
            </div>
            <div class="card"><h2><i class="fas fa-list"></i> Турниры</h2><div id="tn-list"></div></div>
        </div>

        <div id="tab-players" class="admin-section hidden">
            <div class="card"><h2><i class="fas fa-users"></i> Игроки</h2><div id="adm-players"></div></div>
        </div>

        <div id="tab-data" class="admin-section hidden">
            <div class="card"><h2><i class="fas fa-database"></i> Данные</h2>
                <button class="btn btn-r" onclick="clearRounds()"><i class="fas fa-trash"></i> Удалить все раунды</button>
            </div>
        </div>
    </div>
</main>
