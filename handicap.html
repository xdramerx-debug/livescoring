    <style>
        .hcp-tbl-container{width:100%;max-width:100%;overflow-x:hidden;box-sizing:border-box;}
        .hcp-tbl{width:100%;max-width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;box-sizing:border-box;}
        .hcp-tbl th{background:rgba(201,168,76,.15);color:var(--gold);padding:10px 4px;text-align:center;font-size:11px;font-weight:800;border:1px solid var(--border);text-transform:uppercase;}
        .hcp-tbl td{padding:8px 4px;text-align:center;border:1px solid var(--border);font-size:13px;color:var(--white);word-break:break-word;}
        .hcp-tbl tr:nth-child(even) td{background:rgba(255,255,255,.02);}
        .hcp-tbl .tbl-field{font-weight:900;color:var(--gold);font-size:15px;background:rgba(201,168,76,.08);}
        .hcp-row-highlight td{background:rgba(201,168,76,.25) !important;color:#ffffff !important;font-weight:800 !important;border-top:2px solid var(--gold) !important;border-bottom:2px solid var(--gold) !important;}
        .hcp-row-highlight .tbl-field{color:var(--gold) !important;font-size:17px !important;}
        .hcp-result{margin-top:16px;padding:20px;background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.15));border:1px solid rgba(201,168,76,.3);border-radius:var(--rs);text-align:center;}
        .hcp-result-val{font-family:var(--ff);font-size:48px;font-weight:800;color:var(--gold);}
    </style>
</head>

<div class="page-head"><div class="container"><h1 class="page-title"><i class="fas fa-calculator"></i> <span data-i18n="page_title_handicaps">Полевые гандикапы</span></h1><p class="page-sub" data-i18n="page_sub_handicaps">Пестово · Пар 72</p></div></div>

<main class="container" style="padding:24px 20px 60px;">
    <div class="card" style="max-width:520px;margin:0 auto 24px;">
        <h2><i class="fas fa-bolt"></i> <span data-i18n="quick_calc">Быстрый расчёт</span></h2>
        <div class="form-row">
            <div class="form-group"><label data-i18n="exact_hcp">Точный HCP</label><input type="text" id="calc-hcp" class="form-input" data-i18n-placeholder="placeholder_hcp_calc" placeholder="+2.4 или 12.4" oninput="calcField()"></div>
            <div class="form-group"><label data-i18n="gender_label">Пол</label><select id="calc-gender" class="form-input" onchange="calcField()"><option value="men" data-i18n="men">Мужчина</option><option value="women" data-i18n="women">Женщина</option></select></div>
            <div class="form-group"><label data-i18n="tee_select">ТИ</label><select id="calc-tee" class="form-input" onchange="calcField()"><option value="bk" data-i18n="tee_opt_bk">⬛ Чёрный</option><option value="bl" data-i18n="tee_opt_bl">🟦 Синий</option><option value="wh" selected data-i18n="tee_opt_wh">⬜ Белый</option><option value="rd" data-i18n="tee_opt_rd">🟥 Красный</option></select></div>
        </div>
        <div id="calc-result" class="hcp-result hidden">
            <div class="hcp-result-val" id="calc-val">—</div>
            <div style="font-size:13px;color:var(--muted);margin-top:8px;text-transform:uppercase;" data-i18n="field_hcp">Полевой гандикап</div>
        </div>
    </div>

    <div class="card">
        <h2 style="text-align:center;"><i class="fas fa-table"></i> <span data-i18n="full_table_title">Посмотреть полную таблицу</span></h2>
        <p style="color:var(--muted);text-align:center;font-size:13px;margin-bottom:20px;" data-i18n="full_table_sub">Выберите пол и ТИ — таблица появится ниже</p>
        <div class="form-row">
            <div class="form-group"><label data-i18n="tbl_gender">Пол игрока</label>
                <select id="tbl-gender" class="form-input" onchange="onGenderChange()">
                    <option value="" data-i18n="tbl_select_gender">— Выберите пол —</option>
                    <option value="men" data-i18n="men_plural">👨 Мужчина</option>
                    <option value="women" data-i18n="women_plural">👩 Женщина</option>
                </select>
            </div>
            <div class="form-group"><label data-i18n="tee_select">ТИ</label>
                <select id="tbl-tee" class="form-input" onchange="showTable()" disabled>
                    <option value="" data-i18n="select_gender_first">— Сначала выберите пол —</option>
                </select>
            </div>
        </div>
    </div>

    <div id="hcp-tables"></div>
</main>
