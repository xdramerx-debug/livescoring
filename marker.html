<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1a0e">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Пестово">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/logo.png">
    <title>Маркер — Пестово</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<nav class="nav" id="main-nav"><div class="container nav-c">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:nowrap;">
        <a href="index.html" class="nav-brand">
            <img src="img/logo.png" alt="Пестово" class="nav-logo" onerror="this.style.display='none'">
            <span class="nav-brand-text">Пестово</span>
        </a>
        <div id="nav-weather-container"></div>
    </div>
    <div class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Главная</a>
        <a href="leaderboard.html" class="nav-link" data-i18n="nav_leaderboard">Лидерборд</a>
    </div>
</div></nav>

<div class="page-head" style="border-bottom-color:#9b59b6;"><div class="container">
    <h1 class="page-title" id="mk-title">👁️ Маркер</h1><p class="page-sub" id="mk-sub">Подтверждение счёта</p>
    
</div></div>

<main class="container" style="padding:24px 20px 60px;">
    <div id="mk-err" class="card hidden"><h2 style="color:var(--red);">Ошибка</h2><p>QR недействителен.</p></div>
    
    <div id="mk-body" class="hidden">
        <!-- КНОПКИ ВЫЗОВА СУДЬИ / МАРШАЛА -->
        <div style="display:flex;gap:10px;margin-bottom:16px;">
            <button class="btn btn-danger" style="flex:1;font-size:12px;padding:12px 8px;" onclick="callOfficial('referee')">
                <i class="fas fa-gavel"></i> Вызвать судью
            </button>
            <button class="btn btn-warning" style="flex:1;font-size:12px;padding:12px 8px;" onclick="callOfficial('marshal')">
                <i class="fas fa-shield-halved"></i> Вызвать маршала
            </button>
        </div>

        

        <div class="marker-banner"><div style="font-size:28px;">👁️</div>
        <div><strong>Вы — маркер</strong><p>Введите наблюдаемый счёт. Подтверждается только при совпадении.</p></div></div>
        
        <div id="mk-verify"></div>
        <div class="card">
            <div class="hole-display">
                <div class="hole-box"><div class="hole-lbl">Лунка</div><div class="hole-val" id="mk-hole">1</div></div>
                <div class="hole-box h-par"><div class="hole-lbl">Пар</div><div class="hole-val" id="mk-par">4</div></div>
            </div>
            <div class="hole-nav" id="mk-holes"></div>
            <div class="score-area">
                <div class="score-result" id="mk-result"></div>
                <div class="score-disp" id="mk-disp">—</div>
                <div class="score-btns">
                    <button class="score-minus" onclick="adjMk(-1)">−</button>
                    <button class="score-plus" onclick="adjMk(1)">+</button>
                </div>
                <button class="btn btn-g btn-block" onclick="saveMk()" style="padding:16px;font-size:15px;"><i class="fas fa-check"></i> Подтвердить</button>
            </div>
        </div>
        <div class="card"><h2><i class="fas fa-list-check"></i> Сводка</h2><div id="mk-sum"></div></div>
    </div>
</main>

<footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 Пестово</p></div></div></footer>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js?v=2"></script>
<script src="js/marker.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
