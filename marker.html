<div class="page-head" style="border-bottom-color:#9b59b6;"><div class="container">
    <h1 class="page-title" id="mk-title" data-i18n="marker_title">👁️ Маркер</h1><p class="page-sub" id="mk-sub" data-i18n="confirm_score_sub">Подтверждение счёта</p>
</div></div>

<main class="container" style="padding-top:var(--nav-h,70px);padding-left:20px;padding-right:20px;padding-bottom:60px;">
    <div id="mk-err" class="card hidden"><h2 style="color:var(--red);" data-i18n="error_title">Ошибка</h2><p data-i18n="qr_invalid">QR недействителен.</p></div>
    
    <div id="mk-body" class="hidden">
        <!-- КНОПКИ ВЫЗОВА СУДЬИ / МАРШАЛА -->
        <details class="field-more">
            <summary data-i18n="field_more">Вызов судьи и маршала</summary>
            <div style="display:flex;gap:10px;margin-bottom:6px;">
            <button id="mk-referee-call-btn" class="btn btn-danger official-call-btn" style="flex:1;padding:12px 8px;" data-act="callOfficial" data-arg="referee">
                <i class="fas fa-gavel"></i> <span data-i18n="call_referee">Вызвать судью</span>
            </button>
            <button id="mk-marshal-call-btn" class="btn btn-warning official-call-btn" style="flex:1;padding:12px 8px;" data-act="callOfficial" data-arg="marshal">
                <i class="fas fa-shield-halved"></i> <span data-i18n="call_marshal">Вызвать маршала</span>
            </button>
            </div>
        </details>
        <div id="mk-referee-call-status" class="official-call-status hidden" aria-live="polite"></div>
        <div id="mk-marshal-call-status" class="official-call-status hidden" aria-live="polite"></div>

        <div class="marker-banner"><div style="font-size:28px;">👁️</div>
        <div><strong data-i18n="marker_notice_title">Вы — маркер</strong><p data-i18n="marker_notice_desc">Введите наблюдаемый счёт. Подтверждается только при совпадении.</p></div></div>
        
        <div id="mk-verify"></div>
        <div class="score-entry card">
            <div class="hole-display" data-entry-block="info">
                <div class="hole-box"><div class="hole-lbl" data-i18n="hole_lbl">Лунка</div><div class="hole-val" id="mk-hole">1</div></div>
                <div class="hole-box h-par"><div class="hole-lbl" data-i18n="par_lbl">Пар</div><div class="hole-val" id="mk-par">4</div></div>
            </div>
            <div class="hole-nav" data-entry-block="holes" id="mk-holes"></div>
            <div data-entry-block="input">
            <div class="score-area">
                <div class="score-result" id="mk-result"></div>
                <div class="score-disp" id="mk-disp">—</div>
                <div class="score-btns">
                    <button class="score-minus" data-act="adjMk" data-arg="-1">−</button>
                    <button class="score-plus" data-act="adjMk" data-arg="1">+</button>
                </div>
                <div class="score-pad" role="group" aria-label="Счёт">
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="1">1</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="2">2</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="3">3</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="4">4</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="5">5</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="6">6</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="7">7</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="8">8</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="9">9</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="10">10</button>
                    <button type="button" class="score-pad-key score-pad-par" data-act="setScorePadPar" data-i18n="score_pad_par">Пар</button>
                </div>
                <div class="score-toolbar">
                    <button type="button" class="btn btn-ol" data-act="undoLastHole"><i class="fas fa-rotate-left"></i> <span data-i18n="undo_last_hole">Отменить лунку</span></button>
                    <button type="button" class="btn btn-ol" data-act="toggleLargeUi"><i class="fas fa-expand"></i> <span data-i18n="large_ui_btn">Крупно</span></button>
                </div>
                <button class="btn btn-g btn-block" id="mk-save-btn" data-act="saveMk" style="padding:16px;font-size:15px;"><i class="fas fa-check"></i> <span data-i18n="confirm_btn">Подтвердить</span></button>
            </div>
            </div>
        </div>
        <div id="mk-pace-assistant" style="margin-top:12px;"></div>
        <div class="card"><h2><i class="fas fa-list-check"></i> <span data-i18n="group_summary">Сводка</span></h2><div id="mk-sum"></div></div>
    </div>
</main>
