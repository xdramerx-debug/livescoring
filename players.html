<nav class="nav" id="main-nav"><div class="container nav-c">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:nowrap;">
        <a href="index.html" class="nav-brand">
            <img src="img/logo.png" alt="Пестово" class="nav-logo" onerror="this.style.display='none'">
            <span class="nav-brand-text">Пестово</span>
        </a>
        <div id="nav-weather-container"></div>
    </div>
    <button class="nav-toggle" id="nav-toggle"><span></span><span></span><span></span></button>
    <div class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">Главная</a>

    </div>

<div class="page-head"><div class="container"><h1 class="page-title"><i class="fas fa-users"></i> Игроки</h1></div></div>

<main class="container" style="padding:24px 20px 60px;">
    <div class="card">
        <div class="form-row">
            <div class="form-group"><label>Тип игрока</label>
                <select id="filter-type" class="form-input" onchange="loadPlayers()">
                    <option value="all">Все игроки</option>
                    <option value="registered">Только зарегистрированные</option>
                    <option value="guests">Только гости</option>
                </select>
            </div>
            <div class="form-group"><label>Пол</label>
                <select id="filter-gender" class="form-input" onchange="loadPlayers()">
                    <option value="all">Все</option>
                    <option value="men">Мужчины</option>
                    <option value="women">Женщины</option>
                </select>
            </div>
            <div class="form-group"><label>Сортировка</label>
                <select id="sort-by" class="form-input" onchange="loadPlayers()">
                    <option value="rounds">По раундам</option>
                    <option value="hcp-asc">HCP ↑</option>
                    <option value="hcp-desc">HCP ↓</option>
                </select>
            </div>
        </div>
    </div>

    <div id="players-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
        <div class="loading"><div class="spinner"></div></div>
    </div>
</main>

<div id="pmodal" class="modal hidden">
    <div class="modal-bg" onclick="closePModal()"></div>
    <div class="modal-body">
        <button class="modal-close" onclick="closePModal()">&times;</button>
        <div id="pmodal-body"></div>
    </div>
</div>

<footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 Пестово</p></div></div></footer>

<script src="js/pwa.js"></script>
</body>
