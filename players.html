<div class="page-head"><div class="container"><h1 class="page-title"><i class="fas fa-users"></i> <span data-i18n="nav_players">Игроки</span></h1></div></div>

<main class="container" style="padding:24px 20px 60px;">
    <div class="card">
        <div class="form-row">
            <div class="form-group" style="flex:2;min-width:200px;"><label data-i18n="search_label">Поиск игрока</label>
                <input type="text" id="players-search" class="form-input" data-i18n-placeholder="search_placeholder" placeholder="Поиск по имени..." oninput="loadPlayers()">
            </div>
            <div class="form-group"><label data-i18n="player_type">Тип игрока</label>
                <select id="filter-type" class="form-input" onchange="loadPlayers()">
                    <option value="all" data-i18n="all_players">Все игроки</option>
                    <option value="registered" data-i18n="type_registered">Только зарегистрированные</option>
                    <option value="guests" data-i18n="type_guests">Только гости</option>
                </select>
            </div>
            <div class="form-group"><label data-i18n="gender_label">Пол</label>
                <select id="filter-gender" class="form-input" onchange="loadPlayers()">
                    <option value="all" data-i18n="all_genders">Все</option>
                    <option value="men" data-i18n="men_plural">Мужчины</option>
                    <option value="women" data-i18n="women_plural">Женщины</option>
                </select>
            </div>
            <div class="form-group"><label data-i18n="sort_by">Сортировка</label>
                <select id="sort-by" class="form-input" onchange="loadPlayers()">
                    <option value="rounds" data-i18n="sort_rounds">По раундам</option>
                    <option value="hcp-asc">HCP ↑</option>
                    <option value="hcp-desc">HCP ↓</option>
                </select>
            </div>
        </div>
    </div>

    <div id="players-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
        <div class="loading"><div class="spinner"></div></div>
    </div>
</main>

<div id="pmodal" class="modal hidden">
    <div class="modal-bg" onclick="closePModal()"></div>
    <div class="modal-body">
        <div class="modal-top-bar">
            <button type="button" class="btn btn-og btn-sm modal-back-btn" onclick="closePModal()"><i class="fas fa-arrow-left"></i> <span data-i18n="back_btn">Назад</span></button>
            <button type="button" class="modal-close-btn" onclick="closePModal()">&times;</button>
        </div>
        <div id="pmodal-body"></div>
    </div>
