<div class="page-head"><div class="container"><h1 class="page-title"><i class="fas fa-calculator"></i> <span data-i18n="nav_predictor">Симулятор и Прогноз WHS</span></h1><p class="page-sub">Расчёт гандикапа WHS и прогноз следующего раунда</p></div></div>

<main class="container" style="padding-top:var(--nav-h,70px);padding-left:20px;padding-right:20px;padding-bottom:60px;">
    <div class="card" style="max-width:540px;margin:0 auto 24px;">
        <h2><i class="fas fa-user-gear"></i> <span data-i18n="forecast_input_title">Данные для прогноза</span></h2>
        <div class="form-group"><label data-i18n="select_registered_player">Выберите зарегистрированного игрока:</label>
            <select id="pred-user-select" class="form-input" onchange="runWHSPredictor()"></select>
        </div>
        <div class="form-row">
            <div class="form-group"><label data-i18n="gender_label">Пол:</label><select id="pred-gender" class="form-input" onchange="runWHSPredictor()"><option value="men" data-i18n="men">Мужчина</option><option value="women" data-i18n="women">Девушка</option></select></div>
            <div class="form-group"><label data-i18n="planned_tee">Планируемый ТИ:</label><select id="pred-tee" class="form-input" onchange="runWHSPredictor()"><option value="bk" data-i18n="tee_opt_bk">⬛ Чёрный</option><option value="bl" data-i18n="tee_opt_bl">🟦 Синий</option><option value="wh" selected data-i18n="tee_opt_wh">⬜ Белый</option><option value="rd" data-i18n="tee_opt_rd">🟥 Красный</option></select></div>
        </div>
    </div>
