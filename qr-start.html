<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовый протокол · QR-карточки — Пестово</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/design-presets.css?v=1">
    <script src="js/design-system.js?v=1"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700;800&display=swap">
    <style>
        :root { --gold:#c9a84c; --dark:#0b1a0e; --gray:#5a6b5c; --line:#d8d4c8; }
        * { box-sizing: border-box; }
        html,body { margin:0; padding:0; }
        body { background:#eef0e9; color:var(--dark); font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif; }
        .toolbar { position:sticky; top:0; z-index:50; background:var(--dark); color:#fff; padding:10px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.25); }
        .toolbar .t-title { font-family:'Playfair Display',Georgia,serif; font-weight:800; font-size:15px; color:#fff; margin-right:auto; display:flex; align-items:center; gap:8px; }
        .toolbar img { height:26px; width:26px; border-radius:6px; }
        .toolbar .btn { border:none; border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; gap:6px; align-items:center; }
        .btn-g { background:linear-gradient(135deg,#2ecc71,#27ae60); color:#fff; }
        .btn-og { background:var(--gold); color:#1a1a12; }
        .btn-ol { background:transparent; border:1px solid rgba(255,255,255,.4) !important; color:#fff; }
        .btn-r { background:#b03a2e; color:#fff; }
        .sheet-wrap, .cards-wrap { max-width:210mm; margin:0 auto; padding:14px; }
        h1.qr-h { font-family:'Playfair Display',Georgia,serif; font-size:26px; margin:6px 0 2px; }
        .sub { color:var(--gray); font-size:13px; margin:0 0 12px; }
        .sheet { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
        .flights { display:flex; flex-direction:column; gap:12px; }
        .flight-block { border:1px solid var(--line); border-radius:12px; overflow:hidden; page-break-inside:avoid; break-inside:avoid; }
        .flight-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--dark); color:#fff; padding:8px 12px; }
        .flight-title { font-weight:800; font-size:13px; letter-spacing:.3px; }
        .flight-hole { background:var(--gold); color:#1a1a12; border-radius:7px; padding:2px 10px; font-size:12px; font-weight:800; }
        .flight-time { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:7px; padding:2px 9px; font-size:12px; font-weight:700; }
        .flight-count { margin-left:auto; font-size:11.5px; color:#e8d9a8; font-weight:700; }
        .sheet table { width:100%; border-collapse:collapse; font-size:12px; }
        .sheet th { background:#f3efe2; color:var(--dark); padding:6px 8px; text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; border-bottom:2px solid var(--gold); }
        .sheet td { padding:6px 8px; border-bottom:1px solid #eee4d0; }
        .sheet tr:nth-child(even) td { background:#faf7ef; }
        .flight-num { color:var(--gray); font-weight:700; text-align:center; }
        .flag-g { border-left:4px solid var(--gold); padding-left:6px; }
        /* Карточки */
        .pcards { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .pcard { background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 10px 8px; page-break-inside:avoid; break-inside:avoid; position:relative; overflow:hidden; }
        .pcard::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--gold); }
        .grp-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
        .grp-badge { background:var(--dark); color:#fff; border-radius:7px; padding:3px 9px; font-size:12px; font-weight:800; letter-spacing:.4px; }
        .time-badge { background:#f3ecdb; border:1px solid var(--gold); color:#6d5717; border-radius:7px; padding:3px 8px; font-size:11.5px; font-weight:700; }
        .div-badge { background:#eaf3ff; border:1px solid #9db9e8; color:#23407a; border-radius:7px; padding:3px 8px; font-size:11.5px; font-weight:700; }
        .div-inline { color:#23407a; font-size:11px; font-weight:600; white-space:nowrap; }
        .qr-fail { border:1px dashed #c0392b; background:#fdecea; color:#922b21; border-radius:8px; padding:10px 8px; font-size:11px; font-weight:700; }
        .pname { font-size:15px; font-weight:800; line-height:1.2; }
        .pmeta { color:var(--gray); font-size:10.5px; margin:2px 0 6px; display:flex; gap:3px 8px; flex-wrap:wrap; }
        .pmeta b { color:var(--dark); }
        .qr-grid { display:flex; gap:8px; margin-top:4px; }
        .qr-box { flex:1; border:1px dashed #cbbf9f; background:#fcfaf4; border-radius:10px; padding:6px 6px 5px; text-align:center; min-width:0; }
        .qr-box img { width:100%; max-width:108px; height:auto; display:block; margin:0 auto; }
        .qr-lbl { font-size:10px; font-weight:800; margin-bottom:3px; }
        .qr-lbl .fa { color:var(--gold); }
        .qr-url { font-size:7.6px; color:#999; word-break:break-all; margin-top:4px; line-height:1.3; }
        .mark-chip { background:#f3ecdb; border:1px solid #e0d3ac; border-radius:6px; padding:1px 7px; }
        .mark-chip b { color:#6d5717; }
        .members-note { font-size:9.5px; color:var(--gray); margin-top:5px; border-top:1px dotted #ddd; padding-top:3px; line-height:1.4; }
        .members-note b { color:#6d5717; }
        .errbox { max-width:520px; margin:60px auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:30px; text-align:center; }
        .errbox h2 { margin:0 0 8px; font-family:'Playfair Display',serif; }
        .spinner { text-align:center; padding:70px 0; color:var(--gray); }
        .hidden { display:none !important; }
        @media (max-width:760px) {
            .pcards { grid-template-columns:1fr; }
        }
        @media print {
            @page { size:A4; margin:8mm; }
            body { background:#fff; }
            .toolbar { display:none !important; }
            .sheet-wrap, .cards-wrap { max-width:none; padding:0; margin:0; }
            body.print-cards .sheet-wrap { display:none !important; }
            body.print-sheet .cards-wrap { display:none !important; }
            .sheet { border:none; border-radius:0; padding:0; margin:0 0 10px; }
            .sheet table { font-size:10.5px; }
            .flights { gap:8px; }
            .flight-block { border:1px solid #999; border-radius:2mm; }
            .flight-head { background:#222 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; padding:4px 8px; gap:6px; }
            .flight-title { font-size:11px; }
            .flight-hole { font-size:10px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
            .flight-time { font-size:10px; }
            .flight-count { font-size:10px; }
            .sheet th { font-size:9px; padding:4px 6px; }
            .sheet td { padding:4px 6px; }
            .pcards { gap:8px; }
            .pcard { border-radius:8px; padding:10px; border:1px solid #bbb; }
            .pcard::before { display:none; }
            .grp-badge { background:#222 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
            .time-badge { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
            a { color:inherit; text-decoration:none; }
            /* QR-карточки на листе А4: сетка 2 колонки, высота карточки — по
               содержимому (минимум 40мм). РАНЬШЕ карточка имела жёсткие 44мм и
               overflow:hidden, из-за чего «Состав флайта» (и длинные ФИО)
               обрезались и на бумаге были не видны. Теперь карточка
               растягивается под содержимое, а перенос страницы режется только
               между карточками (break-inside:avoid) — состав флайта всегда полный. */
            body.print-cards .qr-cards-head { display:none !important; }
            body.print-cards .cards-wrap { padding:0 !important; }
            body.print-cards .pcards {
                display:grid !important; grid-template-columns:1fr 1fr !important;
                gap:2.5mm !important; grid-auto-rows:min-content !important; align-items:start;
            }
            body.print-cards .pcard {
                height:auto !important; max-height:none !important; overflow:visible !important;
                min-height:40mm; display:flex; flex-direction:column;
                padding:1.6mm 2mm; border:1px solid #999; border-radius:2mm;
                page-break-inside:avoid; break-inside:avoid;
            }
            body.print-cards .grp-row { margin-bottom:0.6mm; gap:1mm; }
            body.print-cards .grp-badge { font-size:7pt; padding:0.5mm 1.6mm; border-radius:1.5mm; }
            body.print-cards .time-badge { font-size:6.5pt; padding:0.5mm 1.6mm; border-radius:1.5mm; }
            body.print-cards .div-badge { font-size:6pt; padding:0.5mm 1.6mm; border-radius:1.5mm; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
            body.print-cards .pname { font-size:9pt; line-height:1.15; max-height:none; overflow:visible; }
            body.print-cards .pmeta { font-size:6.5pt; margin:0.5mm 0 0.6mm; gap:0.6mm 2mm; }
            body.print-cards .qr-grid { margin-top:0.3mm; }
            body.print-cards .qr-box { padding:0.8mm 0.8mm; border-radius:1.5mm; flex:1; }
            body.print-cards .qr-box img { width:auto; max-width:16mm; max-height:16mm; }
            body.print-cards .qr-lbl { font-size:5.8pt; margin-bottom:0.6mm; line-height:1.2; }
            body.print-cards .qr-url { display:none !important; }
            /* Состав флайта — нижняя строка карточки: не режем, переносим по словам.
               margin-top:auto прижимает её к низу, чтобы карточки в ряду были одинаковыми. */
            body.print-cards .members-note {
                font-size:5.8pt; margin-top:auto; padding-top:0.6mm; line-height:1.3;
                max-height:none !important; overflow:visible !important;
                white-space:normal; word-break:normal; overflow-wrap:anywhere;
                margin-bottom:0;
            }
            body.print-cards .members-note b { display:inline; }
            body.print-cards .qr-fail { font-size:6.5pt; padding:1.5mm; }
            body.print-cards .div-inline { font-size:9px; }
        }
    </style>
</head>
<body>
    <div class="toolbar no-print" id="qr-toolbar">
        <div class="t-title"><img src="img/logo.png" alt=""> Пестово · Стартовый протокол</div>
        <button class="btn btn-ol" onclick="location.href='admin.html'">← Админка</button>
        <button class="btn btn-g" onclick="qrPrintMode('cards')"><i>🖨</i> Печать QR-карточек</button>
        <button class="btn btn-og" onclick="qrPrintMode('sheet')"><i>📋</i> Печать стартового листа</button>
        <button class="btn btn-ol" id="qr-retry-btn" onclick="qrRetryFailed()"><i>🔄</i> QR заново</button>
        <span id="qr-status" style="font-size:12px;color:#ffe9a8;margin-left:auto;"></span>
    </div>
    <div id="qr-body">
        <div class="spinner" id="qr-loading">Загрузка протокола…</div>
        <div id="qr-content" class="hidden"></div>
        <div id="qr-error" class="errbox hidden"><h2>⚠️ Протокол не найден</h2><p id="qr-error-text">Проверьте ссылку или вернитесь в админку.</p><p><a href="admin.html">← Вернуться в админ-панель</a></p></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js?v=2"></script>
    <script src="js/qr-start.js?v=6"></script>
</body>
</html>
