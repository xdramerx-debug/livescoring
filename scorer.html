<div class="page-head"><div class="container"><h1 class="page-title" id="sc-title" data-i18n="scorer_title">Ввод счёта</h1><p class="page-sub" id="sc-sub">—</p></div></div>

<main class="container" style="padding:24px 20px 60px;">
    <div id="sc-err" class="card hidden"><h2 style="color:var(--red);" data-i18n="error_title">Ошибка</h2><p data-i18n="qr_invalid">QR-код недействителен.</p><a href="index.html" class="btn btn-g" style="margin-top:12px;" data-i18n="nav_home">На главную</a></div>
    
    <div id="sc-body" class="hidden">
        <!-- КНОПКИ ВЫЗОВА СУДЬИ / МАРШАЛА -->
        <div style="display:flex;gap:10px;margin-bottom:16px;">
            <button class="btn btn-danger" style="flex:1;font-size:12px;padding:12px 8px;" onclick="callOfficial('referee')">
                <i class="fas fa-gavel"></i> <span data-i18n="call_referee">Вызвать судью</span>
            </button>
            <button class="btn btn-warning" style="flex:1;font-size:12px;padding:12px 8px;" onclick="callOfficial('marshal')">
                <i class="fas fa-shield-halved"></i> <span data-i18n="call_marshal">Вызвать маршала</span>
            </button>
        </div>

        <div class="timing-info" id="sc-info"></div>
        <div id="sc-verify"></div>
        <div class="card">
            <div class="hole-display">
                <div class="hole-box"><div class="hole-lbl" data-i18n="hole_lbl">Лунка</div><div class="hole-val" id="sc-hole">1</div></div>
                <div class="hole-box h-par"><div class="hole-lbl" data-i18n="par_lbl">Пар</div><div class="hole-val" id="sc-par">4</div></div>
                <div class="hole-box h-dist"><div class="hole-lbl" data-i18n="dist_lbl">Метры</div><div class="hole-val" id="sc-dist" style="font-size:24px;">—</div></div>
                <div class="hole-box"><div class="hole-lbl" data-i18n="deadline_lbl">Дедлайн</div><div class="hole-val" id="sc-dl" style="font-size:20px;color:var(--gold-l);">—</div></div>
            </div>
            <div class="hole-nav" id="sc-holes"></div>
            <div class="score-area">
                <div class="score-result" id="sc-result"></div>
                <div class="score-disp" id="sc-disp">—</div>
                <div class="score-btns">
                    <button class="score-minus" onclick="adjSc(-1)">−</button>
                    <button class="score-plus" onclick="adjSc(1)">+</button>
                </div>
                <button class="btn btn-g btn-block" onclick="saveSc()" style="padding:16px;font-size:15px;"><i class="fas fa-save"></i> <span data-i18n="save_hole">Сохранить</span></button>
            </div>
        </div>
        <div id="sc-notice"></div>
        <div class="card"><h2><i class="fas fa-table"></i> <span data-i18n="my_score">Мой счёт</span></h2><div id="sc-card"></div></div>
    </div>
</main>
