<div class="page-head"><div class="container"><h1 class="page-title" id="sc-title" data-i18n="scorer_title">Ввод счёта</h1><p class="page-sub" id="sc-sub">—</p></div></div>
<div class="round-event-banner hidden" id="round-event-banner"><div class="container"><div class="round-event-kicker" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:4px;"><i class="fas fa-trophy"></i> <span data-i18n="sec_active_tournament">Активный турнир</span></div><h2 class="round-event-title" id="round-event-title" style="margin:0;font-size:22px;color:var(--white);font-weight:800;"></h2><p class="round-event-sub" id="round-event-sub" style="margin:4px 0 0;color:var(--muted);font-size:13px;"></p></div></div>

<main class="container" style="padding-top:var(--nav-h,70px);padding-left:20px;padding-right:20px;padding-bottom:60px;">
    <div id="sc-err" class="card hidden"><h2 style="color:var(--red);" data-i18n="error_title">Ошибка</h2><p data-i18n="qr_invalid">QR-код недействителен.</p><a href="index.html" class="btn btn-g" style="margin-top:12px;" data-i18n="nav_home">На главную</a></div>
    
    <div id="sc-body" class="hidden">
        <div class="score-entry card">
            <div class="hole-display" data-entry-block="info" data-screen-display="scoring" data-display-key="holeInfo">
                <div class="hole-box h-hole" data-screen-display="scoring" data-display-key="holeNumber"><div class="hole-lbl" data-i18n="hole_lbl">Лунка</div><div class="hole-val" id="sc-hole">1</div></div>
                <div class="hole-box h-par" data-screen-display="scoring" data-display-key="par"><div class="hole-lbl" data-i18n="par_lbl">Пар</div><div class="hole-val" id="sc-par">4</div></div>
                <div class="hole-box h-dist" data-screen-display="scoring" data-display-key="distance"><div class="hole-lbl" data-i18n="dist_lbl">Метры</div><div class="hole-val" id="sc-dist" style="font-size:24px;">—</div></div>
                <div class="hole-box h-dl" data-screen-display="scoring" data-display-key="deadline"><div class="hole-lbl" data-i18n="deadline_lbl">Дедлайн</div><div class="hole-val" id="sc-dl" style="font-size:20px;color:var(--gold-l);">—</div></div>
            </div>
            <div class="hole-nav" data-entry-block="holes" data-screen-display="scoring" data-display-key="holes" id="sc-holes"></div>
            <div data-entry-block="input" data-screen-display="scoring" data-display-key="input">
            <div class="score-area">
                <div class="score-result" id="sc-result"></div>
                <p id="sc-save-status" class="score-save-status" role="status" aria-live="polite"></p>
                <div class="score-disp" id="sc-disp">—</div>
                <div class="score-btns">
                    <button class="score-minus" data-act="adjSc" data-arg="-1">−</button>
                    <button class="score-plus" data-act="adjSc" data-arg="1">+</button>
                </div>
                <div class="score-pad" role="group" aria-label="Счёт">
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="1">1</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="2">2</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="3">3</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="4">4</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="5">5</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="6">6</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="7">7</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="8">8</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="9">9</button>
                    <button type="button" class="score-pad-key" data-act="setScorePad" data-arg="10">10</button>
                    <button type="button" class="score-pad-key score-pad-par" data-act="setScorePadPar" data-i18n="score_pad_par">Пар</button>
                </div>
                <div class="score-toolbar">
                    <button type="button" class="btn btn-ol" data-act="undoLastHole"><i class="fas fa-rotate-left"></i> <span data-i18n="undo_last_hole">Отменить лунку</span></button>
                    <button type="button" class="btn btn-ol" data-act="toggleLargeUi"><i class="fas fa-expand"></i> <span data-i18n="large_ui_btn">Крупно</span></button>
                </div>
                <button class="btn btn-g btn-block" id="sc-save-btn" data-act="saveSc" style="padding:16px;font-size:15px;"><i class="fas fa-save"></i> <span data-i18n="save_hole">Сохранить</span></button>
            </div>
            </div>
        </div>
        <div id="sc-verify" data-screen-display="scoring" data-display-key="verification"></div>
        <!-- КНОПКИ ВЫЗОВА СУДЬИ / МАРШАЛА -->
        <details class="field-more" id="sc-officials" data-screen-display="scoring" data-display-key="officials">
            <summary data-i18n="field_more">Вызов судьи и маршала</summary>
            <div style="display:flex;gap:10px;margin-bottom:6px;">
            <button id="sc-referee-call-btn" class="btn btn-danger official-call-btn" style="flex:1;padding:12px 8px;" data-act="callOfficial" data-arg="referee">
                <i class="fas fa-gavel"></i> <span data-i18n="call_referee">Вызвать судью</span>
            </button>
            <button id="sc-marshal-call-btn" class="btn btn-warning official-call-btn" style="flex:1;padding:12px 8px;" data-act="callOfficial" data-arg="marshal">
                <i class="fas fa-shield-halved"></i> <span data-i18n="call_marshal">Вызвать маршала</span>
            </button>
            </div>
        </details>
        <div id="sc-referee-call-status" data-screen-display="scoring" data-display-key="officials" class="official-call-status hidden" aria-live="polite"></div>
        <div id="sc-marshal-call-status" data-screen-display="scoring" data-display-key="officials" class="official-call-status hidden" aria-live="polite"></div>

        <div class="timing-info" id="sc-info" data-screen-display="scoring" data-display-key="timing"></div>
        <div id="sc-notice" data-screen-display="scoring" data-display-key="notice"></div>
        <div id="sc-pace-assistant" data-screen-display="scoring" data-display-key="pace" style="margin-top:12px;"></div>
        <div class="card" data-screen-display="scoring" data-display-key="scorecard"><h2><i class="fas fa-table"></i> <span data-i18n="my_score">Мой счёт</span></h2><div id="sc-card"></div></div>
        <label class="stableford-display-control" id="sc-stableford-control" data-screen-display="scoring" data-display-key="stableford">
            <input type="checkbox" id="sc-stableford-toggle" data-act="toggleScStablefordDisplay" data-checked="1">
            <span><strong><i class="fas fa-star"></i> <span data-i18n="show_stableford_points">Показывать очки Stableford</span></strong><small data-i18n="show_stableford_points_hint">Очки с учётом полевой форы будут показаны рядом с введённым счётом. Эта настройка сохраняется только для вас.</small></span>
        </label>
    </div>
</main>
