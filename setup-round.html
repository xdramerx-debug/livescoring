<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1a0e">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pestovo">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <title data-i18n="round_setup">Создание раунда — Пестово</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .mode-toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-toggle-btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--border);
            color: var(--white);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .mode-toggle-btn.active {
            background: rgba(201,168,76,0.18);
            border-color: var(--gold);
            color: var(--gold);
        }
        .player-search-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: visible !important;
        }
        .search-results-list {
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 9999999 !important;
            background: #0d1e11 !important;
            border: 2px solid var(--gold) !important;
            border-radius: 10px !important;
            max-height: 260px !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85) !important;
            margin-top: 4px !important;
            touch-action: manipulation !important;
        }
        .search-result-item {
            padding: 12px 16px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            cursor: pointer !important;
            border-bottom: 1px solid rgba(255,255,255,0.08) !important;
            min-height: 48px !important;
            box-sizing: border-box !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -webkit-tap-highlight-color: rgba(201, 168, 76, 0.3) !important;
        }
        .search-result-item:last-child {
            border-bottom: none !important;
        }
        .search-result-item:active, .search-result-item:hover {
            background: rgba(201,168,76,0.25) !important;
        }
    </style>
</head>
<body>

<nav class="nav" id="main-nav">
    <div class="container nav-c">
        <div style="display:flex;align-items:center;gap:14px;">
            <a href="index.html" class="nav-brand">
                <img src="img/logo.png" alt="Pestovo" class="nav-logo" onerror="this.style.display='none'">
                <span class="nav-brand-text" data-i18n="brand_name">Пестово</span>
            </a>
        </div>
        <button class="nav-toggle" id="nav-toggle"><span></span><span></span><span></span></button>
        <div class="nav-menu" id="nav-menu">
            <a href="index.html" class="nav-link" data-i18n="nav_home">Главная</a>
            <a href="setup-round.html" class="nav-link active" data-i18n="nav_round">Раунд</a>
            <a href="leaderboard.html" class="nav-link" data-i18n="nav_leaderboard">Все раунды</a>
            <a href="players.html" class="nav-link" data-i18n="nav_players">Игроки</a>
            <div class="nav-auth" id="nav-auth"></div>
        </div>
    </div>
</nav>

<div class="page-head">
    <div class="container">
        <h1 class="page-title"><i class="fas fa-flag"></i> <span data-i18n="round_setup">Создание раунда</span></h1>
        <p class="page-sub">Выберите режим, параметры и участников игры</p>
    </div>
</div>

<main class="container" style="padding:24px 20px 60px;">

    <!-- 1. РЕЖИМ РАУНДА -->
    <div class="mode-toggle-group">
        <button type="button" class="mode-toggle-btn active" id="btn-mode-solo" onclick="setSetupMode('solo')">
            <i class="fas fa-user"></i> <span>Одиночный раунд</span>
        </button>
        <button type="button" class="mode-toggle-btn" id="btn-mode-group" onclick="setSetupMode('group')">
            <i class="fas fa-users"></i> <span>Групповой раунд</span>
        </button>
    </div>

    <!-- 2. ПАРАМЕТРЫ РАУНДА -->
    <div class="card setup-card">
        <h2><i class="fas fa-cog"></i> <span>Параметры раунда</span></h2>

        <div class="form-row">
            <div class="form-group">
                <label data-i18n="start_time"><i class="fas fa-clock"></i> Время старта</label>
                <input type="time" id="setup-time" class="form-input">
            </div>
            <div class="form-group">
                <label data-i18n="start_hole"><i class="fas fa-flag"></i> Стартовая лунка</label>
                <select id="setup-hole" class="form-input"></select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" id="group-count-wrap" style="display:none;">
                <label><i class="fas fa-hashtag"></i> <span data-i18n="player_count">Игроки в группе</span></label>
                <select id="setup-count" class="form-input" onchange="renderSetupPlayerSlots()">
                    <option value="2" selected>2 игрока</option>
                    <option value="3">3 игрока</option>
                    <option value="4">4 игрока</option>
                </select>
            </div>
            <div class="form-group" style="flex:1 1 180px;">
                <label><i class="fas fa-gamepad"></i> <span data-i18n="format_select">Формат игры</span></label>
                <select id="setup-format" class="form-input">
                    <option value="Stroke Play">Stroke Play</option>
                    <option value="Stableford">Stableford</option>
                    <option value="Match Play 1v1">Матч-плей (1х1)</option>
                    <option value="Match Play 2v2">Матч-плей (2х2)</option>
                    <option value="Scramble">Скрембл (Scramble)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 3. СПИСОК ИГРОКОВ С ЖИВЫМ ПОИСКОМ -->
    <div id="setup-players-container"></div>

    <!-- 4. КНОПКА ЗАПУСКА -->
    <button type="button" class="btn btn-g btn-block" onclick="submitSetupRound()" style="min-height:52px;font-size:16px;margin-top:16px;">
        <i class="fas fa-play"></i> <span>Начать раунд</span>
    </button>

</main>

<footer class="footer"><div class="container"><div class="footer-bottom"><p data-i18n="footer_club">&copy; 2024 Пестово</p></div></div></footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js?v=5"></script>
<script src="js/setup-round.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
